[package]
name = "chaldlauncher"
version = "1.1.0"
description = "ChaldLauncher — Minecraft launcher by Chald Studio (Rust/Tauri)"
authors = ["Chald Studio"]
edition = "2021"
rust-version = "1.77"
default-run = "chaldlauncher"

[lib]
name = "chaldlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
md5 = "0.7"
base64 = "0.22"
open = "5"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "multipart"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
rand = "0.8"
png = "0.18"
tiny_http = "0.12"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
