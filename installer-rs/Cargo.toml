[package]
name = "chald-installer"
version = "1.1.0"
description = "ChaldLauncher custom installer (Rust/Tauri)"
authors = ["Chald Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chald_installer"
path = "src/lib.rs"

[[bin]]
name = "chald-installer"
path = "src/main.rs"

[[bin]]
name = "chald-pack"
path = "src/bin/pack.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
fs2 = "0.4"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
