name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            label: windows-2022-x64
            canonical: true
          - os: ubuntu-22.04
            platform: linux
            label: ubuntu-22.04-x64
            canonical: true
          - os: ubuntu-24.04
            platform: linux
            label: ubuntu-24.04-x64
            canonical: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils \
            file

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Tauri installer
        run: npm run build:tauri

      - name: Prepare Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer (.exe) not found" }
          if ('${{ matrix.canonical }}' -eq 'true') {
            Copy-Item $exe.FullName out/ChaldLauncher-Setup.exe
          } else {
            Copy-Item $exe.FullName "out/ChaldLauncher-Setup-${{ matrix.label }}.exe"
          }
          Get-ChildItem out | Format-Table Name,Length

      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "AppImage not found"
            exit 1
          fi
          src="${files[0]}"
          if [ "${{ matrix.canonical }}" = "true" ]; then
            cp "$src" "out/ChaldLauncher-${VERSION}-linux-x64.AppImage"
          else
            cp "$src" "out/ChaldLauncher-${VERSION}-linux-x64-${{ matrix.label }}.AppImage"
          fi
          ls -lh out

      - name: Check installer size (<= 20 MB)
        shell: bash
        run: |
          set -euo pipefail
          limit=$((20 * 1024 * 1024))
          fail=0
          for f in out/*; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f" | tr -d ' ')
            mb=$(awk "BEGIN {printf \"%.2f\", $size/1024/1024}")
            echo "$f: ${size} bytes (${mb} MB)"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::Installer exceeds 20 MB limit (${mb} MB)"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: chaldlauncher-${{ matrix.label }}
          if-no-files-found: error
          path: out/*
