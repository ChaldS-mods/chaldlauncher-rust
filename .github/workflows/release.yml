# Публикует релиз на GitHub, из которого лаунчер обновляет сам себя.
#
# Как выпустить версию:
#   1. поднять "version" в package.json (например 1.1.0) и закоммитить;
#   2. git tag v1.1.0 && git push origin v1.1.0
#
# Файлы релиза (канонические имена важны: по ним лаунчер выбирает, что скачивать):
#   ChaldLauncher-Setup.exe                     Windows, автообновление/установка
#   ChaldLauncher-<версия>-linux-x64.AppImage   Linux, автообновление (заменяет сам себя)
#
# Сборка переведена на Tauri + размерные оптимизации: Windows/прочие артефакты ≤ 20 МБ, AppImage ≤ 100 МБ.
# Дополнительно собираются варианты под разные версии ОС/раннеров с суффиксом метки сборки.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег существующего релиза-черновика или нового релиза (например v1.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Тег должен совпадать с версией в package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Тег $TAG не совпадает с версией package.json ($VERSION). Лаунчер сравнивает именно эти два числа: при расхождении обновление предлагалось бы бесконечно."
            exit 1
          fi

  build:
    name: build (${{ matrix.label }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Каноническая Windows-сборка (имя файла для автообновления/установки)
          - os: windows-2022
            platform: windows
            label: windows-2022-x64
            canonical: true
          # Каноническая Linux-сборка на более старой Ubuntu для лучшей совместимости (glibc)
          - os: ubuntu-22.04
            platform: linux
            label: ubuntu-22.04-x64
            canonical: true
          # Дополнительная Linux-сборка под более новую версию ОС
          - os: ubuntu-24.04
            platform: linux
            label: ubuntu-24.04-x64
            canonical: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer-rs -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          for i in 1 2 3; do
            if sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              xdg-utils \
              file; then
              exit 0
            fi
            echo "apt-get install failed (attempt $i), retrying..."
            sleep 10
            sudo apt-get update || true
          done
          sudo apt-get install -y --fix-missing \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils \
            file

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows'
        run: npm run build:tauri -- --no-bundle

      - name: Build custom Rust installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "chald-payload-src"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force $stage | Out-Null
          $exe = Join-Path "src-tauri/target/release" "chaldlauncher.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Path src-tauri/target/release -Filter *.exe | Where-Object { $_.Name -ieq 'ChaldLauncher.exe' -or $_.Name -ieq 'chaldlauncher.exe' } | Select-Object -First 1).FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Launcher executable not found in src-tauri/target/release" }
          Copy-Item $exe (Join-Path $stage "ChaldLauncher.exe")
          cargo run --release --manifest-path installer-rs/Cargo.toml --bin chald-pack -- $stage installer-rs/payload/payload.chpk --version $ver --product ChaldLauncher --exe ChaldLauncher.exe --publisher "Chald Studio" --app-id studio.chald.launcher
          cargo build --release --manifest-path installer-rs/Cargo.toml --bin chald-installer
          New-Item -ItemType Directory -Force out | Out-Null
          $outExe = "out/ChaldLauncher-Setup.exe"
          if ('${{ matrix.canonical }}' -ne 'true') { $outExe = "out/ChaldLauncher-Setup-${{ matrix.label }}.exe" }
          Copy-Item installer-rs/target/release/chald-installer.exe $outExe
          Get-ChildItem out | Format-Table Name,Length

      - name: Build Tauri installer (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:tauri -- --bundles appimage

      - name: Prepare Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION=$(node -p "require('./package.json').version")
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "AppImage not found"
            exit 1
          fi
          src="${files[0]}"
          if [ "${{ matrix.canonical }}" = "true" ]; then
            cp "$src" "out/ChaldLauncher-${VERSION}-linux-x64.AppImage"
          else
            cp "$src" "out/ChaldLauncher-${VERSION}-linux-x64-${{ matrix.label }}.AppImage"
          fi
          ls -lh out

      - name: Check installer size
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in out/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.AppImage) limit=$((100 * 1024 * 1024)); label="100 MB" ;;
              *) limit=$((20 * 1024 * 1024)); label="20 MB" ;;
            esac
            size=$(wc -c < "$f" | tr -d ' ')
            mb=$(awk "BEGIN {printf \"%.2f\", $size/1024/1024}")
            echo "$f: ${size} bytes (${mb} MB, limit ${label})"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::Installer exceeds ${label} limit (${mb} MB)"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Создать релиз (черновик с файлами, затем публикация)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la assets
          NOTES=notes.md
          [ -f "$NOTES" ] || printf 'Release %s\n' "${TAG#v}" > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --verify-tag --title "ChaldLauncher ${TAG#v}" --notes-file "$NOTES"
          fi
          gh release edit "$TAG" --draft=false --latest

  site:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Файлы релиза -> VirusTotal. Нужен секрет VT_API_KEY (Settings -> Secrets -> Actions).
      # Без секрета или при сбое VirusTotal шаг не роняет сборку: сайт просто обновится без отчётов.
      - name: Scan release files on VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          mkdir -p vt-files
          gh release download "$TAG" --repo "${{ github.repository }}" --dir vt-files \
            --pattern '*.exe' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.tar.gz' || true
          if ls vt-files/* >/dev/null 2>&1; then
            python3 .github/scripts/virustotal.py vt.json vt-files/*
          else
            echo '{}' > vt.json
          fi

      - name: Update site data
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,publishedAt,url,assets,body > release.json
          gh api "repos/${{ github.repository }}/releases?per_page=100" > all.json
          [ -f vt.json ] || echo '{}' > vt.json
          python3 .github/scripts/update-site.py release.json docs/index.html all.json vt.json
          rm -rf release.json all.json vt.json vt-files

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "site: $TAG"
            git pull --rebase
            git push
          fi
